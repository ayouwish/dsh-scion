# Overriding dsh-scion's configuration in a DSH profile.
#
# dsh-scion is a *bundle*: `dsh plugin add @asyouwish/dsh-scion` appends it to
# the profile's `dsh.profile.bundles`, and the package's own cordis.patch.yml
# inserts the plugin row. Mounting is therefore automatic — nothing has to be
# copied into a profile by hand.
#
# A profile applies its own cordis.patch.yml *after* every bundle layer, so a
# bare id-targeted row like the one below overrides the bundle's config while
# the bundle still owns the row itself. (An `insert:` row with the same id
# would mount the plugin a second time — never do that once the bundle is
# installed.)
#
# ~/.dsh/profiles/web/cordis.patch.yml
- id: scion
  config:
    # Disable to load the plugin inert (no gate, no /scion command).
    enabled: true
    # Install the agent/pre-step veto for imported sessions. The filesystem
    # and ownership layers stay active either way.
    readonlyGate: true
