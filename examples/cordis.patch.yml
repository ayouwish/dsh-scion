# Mounting dsh-scion into a DSH profile.
#
# Copy the block below into ~/.dsh/profiles/<name>/cordis.patch.yml and restart
# `dsh web`. A bare `- id: scion` entry is an id-targeted patch for an existing
# row and is rejected with `patch: entry "scion" not found`; a new row must use
# `insert:`.
#
# Install the package into the profile first:
#
#   dsh plugin --profile web add @asyouwish/dsh-scion@0.2.0
#
# A source checkout reaches the same launcher through its script
# (`pnpm dsh plugin --profile web add ...`) and forwards to the pnpm on PATH,
# while a packaged app injects its own. Keep the profile on the pnpm major that
# last wrote it — node_modules/.modules.yaml records `packageManager`/`storeDir`,
# and mixing majors (pnpm 10 and 11 use store/v10 and store/v11) makes pnpm
# purge and rebuild node_modules instead.

- insert:
    - id: scion
      name: '@asyouwish/dsh-scion'
      config:
        # Disable to load the plugin inert (no gate, no /scion command).
        enabled: true
        # Install the agent/pre-step veto for imported sessions. The
        # filesystem and ownership layers stay active either way.
        readonlyGate: true
